<!DOCTYPE html>
<html lang="nl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meldingen – OVN Scouting</title>

  <script src="generaltheme.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="mobile.css">
  <link rel="icon" href="assets/OVN.logo.png" type="image/png">
</head>

<body>

  <header class="topbar">
    <div class="topbar-left">
      <a href="admin.html" class="backlink">← Admin</a>
      <img src="assets/OVN.logo.png" class="topbar-logo" alt="OVN">
      <div class="topbar-title">
        <h1>Meldingen</h1>
        <span>Problemen, ideeën en vragen van leiding</span>
      </div>
    </div>
    <div class="topbar-right-icons">
      <a href="index.html" class="pill-btn outline">Home</a>
    </div>
  </header>

  <main class="container meldingen-page">

    <section id="accessDeniedCard" class="info-block hidden">
      <h2>Geen toegang</h2>
      <p class="text-muted">Deze pagina is alleen voor admins.</p>
      <a href="index.html" class="pill-btn primary">Terug naar home</a>
    </section>

    <section id="meldingenLoading" class="info-block">
      <p class="text-muted">Meldingen laden…</p>
    </section>

    <section id="adminBugSection" class="planning-section hidden" aria-labelledby="meldingenTitle">
      <div class="meldingen-toolbar">
        <div class="meldingen-tabs" role="tablist" aria-label="Status">
          <button type="button" class="meldingen-tab is-active" data-tab="open" role="tab" aria-selected="true">
            Open <span class="meldingen-tab-count" id="countOpen">0</span>
          </button>
          <button type="button" class="meldingen-tab" data-tab="afgerond" role="tab" aria-selected="false">
            Afgerond <span class="meldingen-tab-count" id="countDone">0</span>
          </button>
        </div>

        <div class="meldingen-filters">
          <div class="meldingen-chips" role="group" aria-label="Type">
            <button type="button" class="meldingen-chip is-active" data-type="alle">Alle</button>
            <button type="button" class="meldingen-chip" data-type="bug">🐞 Bugs</button>
            <button type="button" class="meldingen-chip" data-type="wens">💡 Wensen</button>
            <button type="button" class="meldingen-chip" data-type="vraag">❓ Vragen</button>
          </div>
          <label class="visually-hidden" for="meldingenSearch">Zoeken</label>
          <input id="meldingenSearch" class="meldingen-search" type="search" placeholder="Zoek op titel, tekst of melder…">
        </div>
      </div>

      <h2 id="meldingenTitle" class="visually-hidden">Meldingen</h2>
      <div id="meldingenList" class="meldingen-list" aria-live="polite"></div>
    </section>

  </main>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script src="firebase-config.js"></script>
  <script type="module" src="firebase-imports.js"></script>
  <script src="login.js" defer></script>
  <script type="module" src="utils.js"></script>
  <script type="module" src="bug.js"></script>
  <script src="mobile.js"></script>

</body>

</html>
